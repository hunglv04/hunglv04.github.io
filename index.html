<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang web đầu tiên của tôi</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; color: #222; }
    header { background: #24292f; color: #fff; padding: 40px 16px; text-align: center; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    h2 { margin-top: 0; color: #0969da; }
    footer { text-align: center; padding: 20px; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>Xin chào! 👋</h1>
    <p>Đây là website đầu tiên tôi đăng lên GitHub Pages</p>
  </header>
  <main>
    <div class="card">
      <h2>Giới thiệu</h2>
      <p>Tôi tên là ..., đang học cách dùng GitHub.</p>
    </div>
    <div class="card">
      <h2>Dịch vụ / Sản phẩm</h2>
      <ul>
        <li>Mục 1</li>
        <li>Mục 2</li>
        <li>Mục 3</li>
      </ul>
    </div>
    <div class="card">
      <h2>Liên hệ</h2>
      <p>Điện thoại: 09xx xxx xxx</p>
    </div>
  </main>
  <footer>Làm bằng HTML · Đăng miễn phí bằng GitHub Pages</footer>
</body>
</html>
